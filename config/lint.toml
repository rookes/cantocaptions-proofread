cantonese = "睇"
exceptions = ["看法", "看守", "看護", "看待", "看重", "看齊", "看似", "看來", "看好", "好看", "難看", "看中", "看破", "看透", "看不起", "看門", "看更", "看管", "觀看", "查看", "看台", "收看", "小看", "看見", "看相", "看錯"]

[limits]
line_width = 17.5        # CJK counts 1, half-width 0.5 (CantoCaptions README)
minority_min_majority = 2  # a spelling must appear this often to outvote another
