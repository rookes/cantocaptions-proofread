# Characters CantoCaptions reserves for exactly these readings, so no other reading words.hk
# records for them applies (README: 噉 gam2 vs 咁 gam3 are different words, told apart by
# sound; 着 zoek vs 著 zyu3 likewise).
[exclusive]
"噉" = ["gam2"]
"咁" = ["gam3"]
"著" = ["zyu3"]
"着" = ["zoek6", "zoek3", "zoek2"]
