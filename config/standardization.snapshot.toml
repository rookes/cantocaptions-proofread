# SNAPSHOT of cantocaptions-dataset/rules/standardization.toml, used by ccp lint when the
# dataset is not on this machine. Refreshed by scripts/build_standards.py; do not edit here.

# Standardization DETECTORS. Read-only: there is deliberately no `replace` key
# anywhere in this file, so it cannot be loaded by the parent's rule engine and
# accidentally used to rewrite ground truth.
#
# Sections:
#   [[contrast_sets]]     two graphs competing for one functional slot
#   [[compounds]]         a compound SFP vs loose renderings of the SAME particle
#   [[variants]]          1:1 lexical conventions
#   [[particle_variants]] single-char particle typos needing a positional guard
#   [[markers]]           evidence that standardization was ATTEMPTED, not violated
#
# `floor` values are placeholders — `stdcheck --calibrate` rewrites them from the
# gold corpus and stores the result in data/std/floors.json. Do not hand-tune
# them: gold rates run from 0.985 (tim) to 0.120 (ge2), and a single global floor
# would either fail every set or pass every file.
#
# `confidence = "heuristic"` means the rule needs grammar it does not have. Those
# are excluded from the headline score unless [scoring] include_heuristic = true.

# ---------------------------------------------------------------------------
# Bracket tags that are part of the conventions.
#
# Only [國] (Mandarin) is sanctioned. Everything else — [上海話], [歌詞],
# [菲律賓語], [唔清楚], [？] — is ad-hoc notation and counts against the file's
# `format` axis. The cue itself is dropped from training either way (see
# rules/drop_cues.toml); this is about whether the FILE follows the conventions.
#
# The Cantonese markers [中文]/[粵語]/[廣東話] are absent deliberately: they never
# survive into scored text (strip_tags.toml removes them) and a corpus-wide check
# found zero of them in raw text, so listing them would be dead configuration.
[tags]
allowed = ["國"]

# ---------------------------------------------------------------------------
# Contrast sets — "does this text make the tonal distinction at all?"
#
# NOT "does it maximize rare graphs": 呀 (aa4), 咁 (gam3) and 啦 (laa1) are all
# legitimate standard particles, and scoring strict-share ranks the gold files
# below the corpus median. See standardization.py.
#
# 𠺢 and 吒 are absent on purpose — both are compound-bound (97% and 80% followed
# by 嘛) and live under [[compounds]]. 咤 and 嚹 are dropped: 11 and 1 corpus-wide.
# ---------------------------------------------------------------------------

[[contrast_sets]]
name = "aa"
strict = "吖嗄𠻺"
loose = "呀"

[[contrast_sets]]
name = "gam"
strict = "噉"
loose = "咁"

[[contrast_sets]]
name = "laa"
strict = "喇嗱嘞"
loose = "啦"

[[contrast_sets]]
name = "lo"
strict = "囖"
loose = "囉"

[[contrast_sets]]
name = "tim"
strict = "𠻹㖭"
loose = "添"

[[contrast_sets]]
name = "zek"
strict = "唧"
loose = "啫"

# Low-power but not wrong: 嘅 is overwhelmingly the possessive/nominalising ge3
# and is only partly competing with 𠸏 (ge2). The calibrated floor (~0.042)
# accounts for that; the weighting lets tim/lo/gam/aa carry the signal.
[[contrast_sets]]
name = "ge2"
strict = "𠸏"
loose = "嘅"

# ---------------------------------------------------------------------------
# Compound SFPs — the highest-precision axis.
#
# A compound and its loose rendering are the SAME particle written two ways,
# unlike 呀 vs 吖 which have distinct legitimate uses. Matches are consumed in
# order, so a loose form shared by two standard targets (呀嘛 -> 吖嘛 or 𠻺嗎) is
# counted exactly once.
# ---------------------------------------------------------------------------

[[compounds]]                       # a1 maa3
standard = "吖嘛"
loose = ["呀嘛", "啊嘛", "阿嘛", "阿嗎"]

[[compounds]]                       # a6 maa5
standard = "𠻺嗎"
loose = ["呀嗎", "啊嗎"]

[[compounds]]                       # ga1 maa3
standard = "𠺢嘛"
loose = ["㗎嘛", "嘅嘛", "架嘛"]

[[compounds]]                       # za1 maa3
standard = "吒嘛"
loose = ["啫嘛", "之嘛", "姐嘛", "咋嘛", "啫嗎", "咋嗎"]

[[compounds]]                       # a1 naa4
standard = "吖嗱"
loose = ["呀嗱", "啊嗱"]

[[compounds]]                       # a3 ho2
standard = "啊嗬"
loose = ["呀嗬", "啊可"]

[[compounds]]                       # a3 haa2
standard = "啊吓"
loose = ["呀吓"]

[[compounds]]                       # a6 le5
standard = "𠻺哩"
loose = ["呀哩", "啊哩"]

[[compounds]]                       # ga3 wo3
standard = "㗎喎"
loose = ["嘅喎", "架喎"]

[[compounds]]                       # ga3 ze1
standard = "㗎啫"
loose = ["嘅啫", "架啫"]

[[compounds]]                       # ga3 zek1
standard = "㗎唧"
loose = ["嘅唧", "架唧"]

[[compounds]]                       # la3 wo3
standard = "喇喎"
loose = ["啦喎"]

[[compounds]]                       # ha6 waa5
standard = "下哇"
loose = ["係哇", "呀哇"]

# Not in the README compound table, but behaves exactly like one: the tone here
# is gam2, so the standard form is 噉啦 / 噉喇. Measured 125 vs 122 corpus-wide,
# an unusually well-balanced discriminator.
[[compounds]]
standard = "噉啦"
loose = ["咁啦"]

[[compounds]]
standard = "噉喇"
loose = ["咁喇"]

# ---------------------------------------------------------------------------
# Particle variants needing the sentence-final guard.
#
# 架, 嫁 and 噶 are ordinary words as well as particles (架車 132x, 嫁畀 45x), so
# they only count as particles in utterance-final position. The guard's
# punctuation class includes ASCII on purpose — `架!` and `架?` are real particle
# uses and appear in exactly the files that use ASCII punctuation.
# ---------------------------------------------------------------------------

[[particle_variants]]
nonstandard = "噶"
standard = "㗎"
guard = "sentence_final"

[[particle_variants]]
nonstandard = "架"
standard = "㗎"
guard = "sentence_final"

[[particle_variants]]
nonstandard = "嫁"
standard = "㗎"
guard = "sentence_final"

[[particle_variants]]               # 嗟 for 咋 / 啫 — 97% sentence-final already
nonstandard = "嗟"
standard = "啫"
guard = "sentence_final"

