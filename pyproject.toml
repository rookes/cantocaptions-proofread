[project]
name = "cantocaptions-proofread"
version = "0.1.0"
description = "Tools and agent skills for proofreading CantoCaptions written-Cantonese subtitles"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "yt-dlp[default]>=2026.8.19",
    "pycantonese>=3.4.0",
]

[project.scripts]
ccp = "ccp.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
